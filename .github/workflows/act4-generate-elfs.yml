name: TitoRV ACT4 RV32I ELF generation

on:
  push:
    branches:
      - verification/riscv-directed-tests
    paths:
      - "verification/act4/**"
      - ".github/workflows/act4-generate-elfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-unprivileged-rv32i:
    name: Generate ACT4 unprivileged RV32I ELFs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes make git curl ca-certificates
      - name: Install GCC 15 RISC-V toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xpack-riscv-gcc.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz \
            --output "$archive"
          echo "aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758  $archive" | sha256sum --check
          mkdir -p "$HOME/riscv-toolchain"
          tar xzf "$archive" --directory "$HOME/riscv-toolchain" --strip-components=1
          test -x "$HOME/riscv-toolchain/bin/riscv-none-elf-gcc"
          ln -sf riscv-none-elf-gcc "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-gcc"
          ln -sf riscv-none-elf-objdump "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-objdump"
          ln -sf riscv-none-elf-objcopy "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-objcopy"
          echo "$HOME/riscv-toolchain/bin" >> "$GITHUB_PATH"
          "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-gcc" --version
          "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-objdump" --version
      - name: Check out official ACT4 framework
        uses: actions/checkout@v4
        with:
          repository: riscv/riscv-arch-test
          ref: act4
          path: .tools/riscv-arch-test
      - name: Set up ACT4 framework tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          working_directory: .tools/riscv-arch-test
          version: 2026.9.13
      - name: Install Sail 0.16 reference model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/riscv-sail"
          curl --fail --location --silent --show-error \
            https://github.com/riscv/sail-riscv/releases/download/0.16/sail-riscv-Linux-x86_64.tar.gz \
            | tar xz --directory "$HOME/riscv-sail" --strip-components=1
          sail_binary=$(find "$HOME/riscv-sail" -type f -name sail_riscv_sim -print -quit)
          if [[ -z "$sail_binary" ]]; then
            echo "Could not find sail_riscv_sim in the extracted Sail release."
            find "$HOME/riscv-sail" -maxdepth 4 -type f -print
            exit 1
          fi
          chmod +x "$sail_binary"
          echo "$(dirname "$sail_binary")" >> "$GITHUB_PATH"
          "$sail_binary" --version
      - name: Install TitoRV ACT4 configuration
        run: |
          mkdir -p .tools/riscv-arch-test/config/cores/chomskyintech/titorv-rv32i
          cp verification/act4/test_config.yaml \
             verification/act4/titorv-rv32i.yaml \
             verification/act4/sail.json \
             verification/act4/link.ld \
             verification/act4/rvmodel_macros.h \
             .tools/riscv-arch-test/config/cores/chomskyintech/titorv-rv32i/
      - name: Generate unprivileged RV32I tests and self-checking ELFs
        working-directory: .tools/riscv-arch-test
        env:
          CONFIG_FILES: config/cores/chomskyintech/titorv-rv32i/test_config.yaml
          EXTENSIONS: I
          JOBS: "2"
        run: |
          mise trust .mise.toml
          make
          test -d work/titorv-rv32i/elfs
          count=$(find work/titorv-rv32i/elfs -maxdepth 1 -type f -name '*.elf' | wc -l)
          echo "Generated ACT4 ELF count: $count"
          test "$count" -gt 0
      - name: Upload generated ACT4 ELFs and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titorv-act4-rv32i
          path: |
            .tools/riscv-arch-test/work/titorv-rv32i/elfs/
            .tools/riscv-arch-test/work/titorv-rv32i/build/
          if-no-files-found: warn
          retention-days: 14
