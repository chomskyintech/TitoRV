name: TitoRV ELF execution harness smoke test

on:
  push:
    branches:
      - verification/riscv-directed-tests
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V toolchain and Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf iverilog

      - name: Build RV32I smoke ELF
        run: |
          riscv64-unknown-elf-gcc \
            -march=rv32i -mabi=ilp32 -nostdlib -nostartfiles \
            -Wl,-Ttext=0 -Wl,--no-relax -Wl,-e,_start \
            -o /tmp/titorv-elf-smoke.elf verification/elf_smoke.S
          riscv64-unknown-elf-objcopy -O binary /tmp/titorv-elf-smoke.elf /tmp/titorv-elf-smoke.bin
          python3 verification/bin_to_hex.py /tmp/titorv-elf-smoke.bin /tmp/titorv-elf-smoke.hex
          riscv64-unknown-elf-objdump -d /tmp/titorv-elf-smoke.elf

      - name: Compile ELF simulation harness
        run: |
          iverilog -g2012 -Wall -s tb_riscv_elf \
            -o /tmp/titorv-elf-smoke.vvp \
            tapeout_project/riscv_core.v tapeout_project/riscv_elf_tb.sv

      - name: Run compiled program on TitoRV
        run: vvp /tmp/titorv-elf-smoke.vvp +ROM=/tmp/titorv-elf-smoke.hex

      - name: Fetch public RISC-V ISA tests
        run: git clone --depth 1 --recurse-submodules https://github.com/riscv-software-src/riscv-tests.git /tmp/riscv-tests

      - name: Build public RV32UI ADD test
        run: |
          riscv64-unknown-elf-gcc \
            -march=rv32i -mabi=ilp32 -static -mcmodel=medany \
            -nostdlib -nostartfiles -fno-pic -fno-pie \
            -I/tmp/riscv-tests/env/p \
            -I/tmp/riscv-tests/isa/macros/scalar \
            -T verification/riscv-tests-link.ld \
            -Wl,--no-relax -Wl,-e,_start \
            /tmp/riscv-tests/isa/rv32ui/add.S \
            -o /tmp/titorv-riscv-tests-add.elf
          riscv64-unknown-elf-objcopy -O binary /tmp/titorv-riscv-tests-add.elf /tmp/titorv-riscv-tests-add.bin
          python3 verification/bin_to_hex.py /tmp/titorv-riscv-tests-add.bin /tmp/titorv-riscv-tests-add.hex
          riscv64-unknown-elf-objdump -d /tmp/titorv-riscv-tests-add.elf

      - name: Run public RV32UI ADD test on TitoRV
        run: vvp /tmp/titorv-elf-smoke.vvp +ROM=/tmp/titorv-riscv-tests-add.hex
