name: CGRA CI

on:
  pull_request:
    paths:
      - 'cgra_standalone/**'
      - '.github/workflows/cgra-ci.yml'
  push:
    branches:
      - cgra-standalone
    paths:
      - 'cgra_standalone/**'
      - '.github/workflows/cgra-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Run standalone simulation
        working-directory: cgra_standalone
        run: make sim

      - name: Run generic synthesis
        working-directory: cgra_standalone
        run: make synth
