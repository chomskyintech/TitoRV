name: TitoRV ACT4 RV32I execution

on:
  workflow_run:
    workflows:
      - TitoRV ACT4 RV32I ELF generation
    types:
      - completed
    branches:
      - verification/riscv-directed-tests
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  execute-act4:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'verification/riscv-directed-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out TitoRV at the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'verification/riscv-directed-tests' }}

      - name: Install simulator and RISC-V binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: Download generated ACT4 ELF artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: titorv-act4-rv32i
          path: /tmp/act4-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Generate ACT4 ELFs on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual dispatch requires a completed ACT4 generation artifact."
          exit 1

      - name: Compile TitoRV ELF harness
        run: |
          iverilog -g2012 -Wall -s tb_riscv_elf \
            -o /tmp/titorv-act4.vvp \
            tapeout_project/riscv_core.v tapeout_project/riscv_elf_tb.sv

      - name: Execute generated ACT4 RV32I tests
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t elfs < <(find /tmp/act4-artifact -type f -name '*.elf' | sort)
          echo "Discovered ACT4 ELF files: ${#elfs[@]}"
          if [ "${#elfs[@]}" -eq 0 ]; then
            echo "No ELF files found in downloaded artifact."
            find /tmp/act4-artifact -maxdepth 6 -type f | head -200
            exit 1
          fi

          mkdir -p /tmp/act4-results
          pass_count=0
          fail_count=0
          index=0
          for elf in "${elfs[@]}"; do
            index=$((index + 1))
            name=$(basename "$elf" .elf)
            bin="/tmp/act4-results/${index}-${name}.bin"
            hex="/tmp/act4-results/${index}-${name}.hex"
            log="/tmp/act4-results/${index}-${name}.log"
            echo "=== ACT4 [${index}/${#elfs[@]}]: ${elf#/tmp/act4-artifact/} ==="
            if ! riscv64-unknown-elf-objcopy -O binary "$elf" "$bin"; then
              echo "FAIL: objcopy failed for $elf" | tee "$log"
              fail_count=$((fail_count + 1))
              continue
            fi
            if ! python3 verification/bin_to_hex.py "$bin" "$hex"; then
              echo "FAIL: binary-to-hex conversion failed for $elf" | tee "$log"
              fail_count=$((fail_count + 1))
              continue
            fi
            if timeout 30s vvp /tmp/titorv-act4.vvp +ROM="$hex" >"$log" 2>&1; then
              if grep -Eq '^PASS: (ELF program wrote the PASS token|public RISC-V test exited successfully)' "$log"; then
                echo "PASS: $name"
                pass_count=$((pass_count + 1))
              else
                echo "FAIL: simulator exited without a recognized pass marker: $name"
                cat "$log"
                fail_count=$((fail_count + 1))
              fi
            else
              status=$?
              echo "FAIL: simulator status $status: $name"
              cat "$log"
              fail_count=$((fail_count + 1))
            fi
          done

          {
            echo "# ACT4 RV32I execution summary"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Discovered ELF files: ${#elfs[@]}"
            echo "- Passed: $pass_count"
            echo "- Failed: $fail_count"
            echo
            echo "## Per-test result"
            for log in /tmp/act4-results/*.log; do
              [ -f "$log" ] || continue
              printf '\n### %s\n\n' "$(basename "$log" .log)"
              tail -20 "$log"
            done
          } > /tmp/act4-results/SUMMARY.md
          cat /tmp/act4-results/SUMMARY.md
          echo "ACT4_PASS_COUNT=$pass_count" >> "$GITHUB_ENV"
          echo "ACT4_FAIL_COUNT=$fail_count" >> "$GITHUB_ENV"
          if [ "$fail_count" -ne 0 ]; then
            exit 1
          fi

      - name: Upload ACT4 execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titorv-act4-rv32i-execution-results
          path: /tmp/act4-results/
          if-no-files-found: warn
          retention-days: 14
